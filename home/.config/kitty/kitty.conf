enable_audio_bell no
font_size 13
font_family JetBrains Mono

# Balanced rendering for the 60 Hz display and integrated Intel graphics.
# Keep frame synchronization enabled to avoid tearing.
repaint_delay 16
input_delay 2
sync_to_monitor yes

# SKYNET HUD layout: a little breathing room inside the red dwm border and a
# tab bar that reads like console channels ("01 // title"). Static styling
# only; no animation or extra repaint work.
window_padding_width 4 10
tab_bar_edge bottom
tab_bar_style separator
tab_separator ""
tab_bar_margin_height 4 0
tab_title_max_length 32
tab_title_template " {fmt.fg._69222e}{index:02d} {fmt.fg._5c6670}// {fmt.fg.tab}{title} "
active_tab_title_template "{fmt.fg._ff4050}▌{fmt.fg.tab}{index:02d} {fmt.fg._ff6875}// {fmt.fg.tab}{title} "
# BEGIN_KITTY_THEME
# Default
include current-theme.conf
# END_KITTY_THEME
