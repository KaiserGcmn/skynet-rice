# SKYNET / NEURAL INTERFACE
# Interface colors plus a 16-color ANSI palette in the same black/red/steel
# family. Red stays dominant; the other hues are muted so diffs, ls and
# syntax colors remain distinguishable without leaving the theme.
background #000000
foreground #dde3ea
cursor #ff4050
cursor_text_color #050609
selection_background #481722
selection_foreground #ffffff
url_color #ff6875
active_border_color #ff4050
inactive_border_color #252c36
bell_border_color #ff6875
active_tab_background #481722
active_tab_foreground #ffffff
inactive_tab_background #080a0e
inactive_tab_foreground #a9bbc5
tab_bar_background #000000
active_tab_font_style bold
inactive_tab_font_style normal

# ANSI palette (normal / bright)
# black: panel / steel shadow
color0  #0b0c0f
color8  #5c6670
# red: SKYNET signal
color1  #ff4050
color9  #ff6875
# green: success as cold teal
color2  #3fbfa8
color10 #6edbc6
# yellow: amber warning
color3  #e8a33d
color11 #ffc46b
# blue: steel blue
color4  #6c8ea8
color12 #93b4cc
# magenta: muted rose
color5  #c94f7c
color13 #f07aa5
# cyan: data readout
color6  #4fc3cf
color14 #8ee3ea
# white: steel label / bright text
color7  #a9bbc5
color15 #eceef1
