Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "on"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
EndSection

Section "InputClass"
    Identifier "touchpad"
    Driver "libinput"
    MatchIsTouchpad "yes"
    Option "Tapping" "on"
    Option "AccelSpeed" "0.6"   # Range from -1 (slow) to 1 (fast)
EndSection
