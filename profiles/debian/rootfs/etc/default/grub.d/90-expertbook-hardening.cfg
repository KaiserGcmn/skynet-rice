# ASUS ExpertBook B3405CCA / Core Ultra 7 255H / Debian 13 Linux 6.12.
# Keep Debian's LSM list (including AppArmor), 32-bit applications and the
# existing Intel graphics/IOMMU policy. Apply only to normal boot entries.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} slab_nomerge init_on_alloc=1 page_alloc.shuffle=1 randomize_kstack_offset=on vsyscall=none iommu.passthrough=0 efi=disable_early_pci_dma nmi_watchdog=0 loglevel=3"
# Keep the previous-settings entry accessible during the first boot test.
GRUB_TIMEOUT_STYLE=menu
