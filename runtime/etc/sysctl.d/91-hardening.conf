# SKYNET: tek kullanıcılı dizüstü için düşük riskli çekirdek ve ağ sertleştirmesi.

# Çekirdek bellek adreslerini yetkisiz kullanıcılardan gizle.
kernel.kptr_restrict = 1

# Bir süreç yalnız kendi alt süreçlerini ptrace edebilir (gdb/strace -p için root gerekir).
kernel.yama.ptrace_scope = 1

# Çalışan çekirdeği kexec ile değiştirmeyi kapat (yeniden başlatmaya kadar geri alınamaz).
kernel.kexec_load_disabled = 1

# ICMP yönlendirmelerini ne kabul et ne gönder: yerel ağda MITM vektörü, makine yönlendirici değil.
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.*.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.*.send_redirects = 0
-net.ipv6.conf.default.accept_redirects = 0
-net.ipv6.conf.*.accept_redirects = 0

# TIME-WAIT soketlerinin RST ile öldürülmesini engelle (RFC 1337).
net.ipv4.tcp_rfc1337 = 1
