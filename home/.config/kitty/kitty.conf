enable_audio_bell no
font_size 13
font_family JetBrains Mono

# Balanced rendering for the 60 Hz display and integrated Intel graphics.
# Keep frame synchronization enabled to avoid tearing.
repaint_delay 16
input_delay 2
sync_to_monitor yes

# BEGIN_KITTY_THEME
# Default
include current-theme.conf
# END_KITTY_THEME
