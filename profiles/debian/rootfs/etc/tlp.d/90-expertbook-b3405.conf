# ASUS ExpertBook B3405CCA / Core Ultra 7 255H
# Debian 13, Linux 6.12, TLP 1.8: balanced daily-use profile.
TLP_ENABLE=1
TLP_DEFAULT_MODE=AC
TLP_PERSISTENT_DEFAULT=0

# intel_pstate active/HWP: let hardware choose frequencies dynamically.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=100
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# These are the actual profiles exposed by this ASUS firmware.
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=quiet

# Use driver-supported PCI runtime PM, retaining firmware ASPM policy.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto
# Keep both USB host controllers and the SOF audio controller awake on AC/BAT.
RUNTIME_PM_DISABLE="00:0d.0 00:14.0 00:1f.3"

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=0
SOUND_POWER_SAVE_CONTROLLER=N

# Disable USB autosuspend. The matching udev rule also keeps kernel-enabled
# autosuspend off for existing/new USB devices, including root hubs.
USB_AUTOSUSPEND=0
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_BTUSB=1
USB_EXCLUDE_PHONE=1
USB_EXCLUDE_PRINTER=1

# Avoid extending the dirty-data writeback interval on battery.
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=15

# ASUS supports a stop threshold only; the start value is an unused placeholder.
START_CHARGE_THRESH_BAT0=0
STOP_CHARGE_THRESH_BAT0=80

# NVMe APST, graphics clocks, sleep mode and thermal limits use system defaults.
