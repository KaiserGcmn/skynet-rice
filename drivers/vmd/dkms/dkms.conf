# SKYNET: Intel VMD MTL016 kesme düzeltmesi (8086:7d0b, Arrow Lake / Meteor Lake).
# vmd.c = Debian linux-source-6.12 6.12.117-1 + drivers/vmd/backport.patch.
#
# Güvenlik kilidi: modül yalnızca hedef çekirdeğin dağıtım vmd.ko'su, bu yamanın
# uygulandığı kaynakla aynı srcversion'a sahipse derlenir. Kaynak değişirse DKMS
# derlemeyi "BUILD_EXCLUSIVE" olarak atlar (çekirdek kurulumu bozulmaz) ve
# sistem dağıtımın yamasız sürücüsüyle açılır; yama yeni kaynağa taşınmalıdır.
PACKAGE_NAME="vmd-mtl016"
PACKAGE_VERSION="0.6-mtl016.1"
BUILT_MODULE_NAME[0]="vmd"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

VMD_STOCK_SRCVERSION="9CED7F0241F8FAD2F7858E3"
BUILD_EXCLUSIVE_KERNEL="^vmd-mtl016-kaynak-dogrulanmadi$"
for _vmd_stock in /lib/modules/"${kernelver}"/kernel/drivers/pci/controller/vmd.ko*; do
    if [ -f "${_vmd_stock}" ] && \
       [ "$(/usr/sbin/modinfo -F srcversion "${_vmd_stock}" 2>/dev/null)" = "${VMD_STOCK_SRCVERSION}" ]; then
        BUILD_EXCLUSIVE_KERNEL="^6[.]12[.]"
    fi
done
unset _vmd_stock
